name: Build Tun2Socks AAR

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Prepare Go Environment & gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init
          go get golang.org/x/mobile/bind@latest
          go mod download

      - name: Compile AAR
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p output
          gomobile bind -v \
            -target=android/arm,android/arm64,android/386,android/amd64 \
            -androidapi 21 \
            -javapkg=com.xjasonlyu.tun2socks \
            -ldflags="-s -w" \
            -o output/tun2socks.aar \
            github.com/xjasonlyu/tun2socks/v2/mobile

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tun2socks-release
          path: output/tun2socks.aar
